[project]
name = "week17-agent-mlops"
version = "1.0.0"
description = "Track B reproducible prompt experiments, traces, and regression monitoring"
requires-python = ">=3.11,<3.13"
dependencies = [
  "evidently[llm]==0.7.23",
  "mlflow==2.22.2",
  "pandas==2.2.3",
  "pypdf==6.1.0",
  "python-dotenv==1.1.0",
  "requests==2.32.5",
  "sqlalchemy==2.0.43",
  "tabulate==0.9.0",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evaluation", "mlops/tests"]

