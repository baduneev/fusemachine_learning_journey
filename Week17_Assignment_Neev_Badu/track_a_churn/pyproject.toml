[project]
name = "week17-churn-mlops"
version = "1.0.0"
description = "Track A reproducible Telco Churn training, registry, serving, and drift monitoring"
requires-python = ">=3.11,<3.13"
dependencies = [
  "evidently==0.6.7",
  "fastapi==0.115.12",
  "joblib==1.4.2",
  "matplotlib==3.10.3",
  "mlflow==2.22.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.43",
  "tabulate==0.9.0",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

